<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Yassine Hamouarab · Portfolio</title>
<style id="st">
:root{--bg:#fff;--fg:#111;--card:#fff;--mut:#555;--ac:#111;--bd:#dcdcdc;--on:#fff;--ov:rgba(0,0,0,0.65);--ov2:rgba(0,0,0,0.3);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--fg:#f5f5f5;--card:#141414;--mut:#a3a3a3;--ac:#fff;--bd:#2c2c2c;--on:#000;--ov:rgba(0,0,0,0.8);--ov2:rgba(0,0,0,0.6)}}
:root[data-theme="dark"]{--bg:#0a0a0a;--fg:#f5f5f5;--card:#141414;--mut:#a3a3a3;--ac:#fff;--bd:#2c2c2c;--on:#000;--ov:rgba(0,0,0,0.8);--ov2:rgba(0,0,0,0.6)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 80px}
.hero{display:flex;gap:25px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:35px;position:relative;overflow:hidden;min-height:320px;background-size:cover !important;background-position:center !important}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to right, var(--ov) 0%, var(--ov2) 100%);z-index:1}
.hero-content{position:relative;z-index:2;flex:1;min-width:260px;color:#fff}
.hero-content h1{color:#fff;font-size:2.2rem;margin:0;text-shadow:0 2px 10px rgba(0,0,0,0.8);text-transform:uppercase}
.hero-content .t{color:#38bdf8;font-weight:600;font-size:1.1rem;margin:8px 0}
.hero-content .ct{display:flex;flex-wrap:wrap;gap:10px 20px;font-size:.95rem;color:#e2e8f0;margin-top:15px}
.ph{width:145px;height:175px;object-fit:cover;object-position:top;border-radius:18px;border:3px solid #fff;position:relative;z-index:2;box-shadow:0 12px 30px rgba(0,0,0,0.5)}
h2{color:var(--ac);border-bottom:2px solid var(--bd);padding-bottom:8px;margin-top:40px}

/* ستايل المشاريع */
.pj{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:24px;margin:20px 0;overflow:hidden}
.pj h3{margin:0 0 8px;color:var(--ac);font-size:1.4rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:4px 12px;font-size:.85rem;color:var(--mut);font-weight:500}

/* الكاروسيل المطور */
.gal-wrapper{position:relative;margin:16px 0;width:100%;background:#111;border-radius:12px;overflow:hidden}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;gap:0;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{
    flex:0 0 100%;
    width:100%;
    height:400px;
    object-fit: contain; /* هادي هي اللي كتصغر الصورة بلا ما تقطعها */
    scroll-snap-align:start;
}
.nav-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.5);color:#fff;border:0;width:40px;height:40px;border-radius:50%;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center;font-size:20px;backdrop-filter:blur(4px);transition:0.2s}
.nav-btn:hover{background:rgba(0,0,0,0.8)}
.nav-btn.prev{left:10px}.nav-btn.next{right:10px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:15px}
.card{all:unset;cursor:pointer;display:block;background:var(--ac);color:var(--on);border-radius:18px;padding:30px 20px;text-align:center;font-weight:600}
.srch{background:#1e293b;color:#38bdf8;border-radius:14px;padding:16px 20px;margin:25px 0;font-weight:600;border:1px solid #38bdf8}
.btn{cursor:pointer;border:0;background:var(--ac);color:var(--on);border-radius:12px;padding:12px 24px;font:inherit;font-weight:700}
.btn.g{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
input,textarea,select{width:100%;font:inherit;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--fg);margin:5px 0 15px}
.tg{position:fixed;top:15px;right:15px;z-index:100;width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center}
.fab{position:fixed;right:20px;bottom:20px;box-shadow:0 8px 25px rgba(0,0,0,0.3);z-index:100}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.th{position:relative;margin:8px}.th img{width:100px;height:70px;object-fit:cover;border-radius:10px}
.th button{position:absolute;top:-8px;right:-8px;border-radius:50%;border:0;background:#e74c3c;color:#fff;width:24px;height:24px;cursor:pointer}
@media (max-width: 600px) {
  .hero{text-align:center;justify-content:center;padding:25px 15px}.hero-content{min-width:100%}.hero-content .ct{justify-content:center;flex-direction:column}.ph{width:130px;height:160px}.gal img{height:250px}
}
</style></head><body><main id="root"></main>
<script id="data" type="application/json">
{
  "name": "HAMOUARAB YASSINE",
  "title": "Étudiant en Master Smart Industry · Génie Électrique & Informatique Industrielle",
  "city": "Safi, Maroc",
  "email": "yassinehamouarab@gmail.com",
  "phone": "0696833841",
  "about": "Passionné par l'automatisation...",
  "photo": "https://via.placeholder.com/150",
  "banner": "https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?q=80&w=1000",
  "search": "🔎 En recherche d’un Stage de Fin d’Études (PFE)",
  "motiv": [],
  "projects": []
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script id="app">
const S=JSON.parse(document.getElementById('data').textContent);
const R=document.getElementById('root');let isOwner=false,editing=null,imgs=[];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS={ac:'🎓 Projets Académiques',pro:'🏭 Projets Professionnels'};
const hash=()=>location.hash.slice(1)||'home';

window.slide = (id, dir) => {
  const el = document.getElementById('gal-' + id);
  const step = el.clientWidth;
  el.scrollBy({ left: step * dir, behavior: 'smooth' });
};

function pj(p){
  const images = p.imgs || [];
  const hasMultiple = images.length > 1;
  return `<article class="pj">
    <h3>${esc(p.title)}</h3>
    <div class="meta">${esc(p.year)}</div>
    <div class="chips">
      ${(p.tools||'').split(',').map(t=>t.trim()).filter(Boolean).map(t=>`<span class="chip">${esc(t)}</span>`).join('')}
    </div>
    <div class="gal-wrapper">
      <div class="gal" id="gal-${p.id}">
        ${images.map(u=>`<img src="${esc(u)}" loading="lazy">`).join('')}
      </div>
      ${hasMultiple ? `
        <button class="nav-btn prev" onclick="slide('${p.id}', -1)">❮</button>
        <button class="nav-btn next" onclick="slide('${p.id}', 1)">❯</button>
      ` : ''}
    </div>
    <p class="desc" style="white-space:pre-line">${esc(p.desc)}</p>
  </article>`
}

function render(){const v=hash();let h='';
if(v==='home'){h=`
<section class="hero" style="background: url('${S.banner}')">
<div class="hero-overlay"></div>
<img class="ph" src="${S.photo}">
<div class="hero-content">
  <h1>${esc(S.name)}</h1><p class="t">${esc(S.title)}</p>
  <div class="ct"><span>📍 ${esc(S.city)}</span><span>✉️ ${esc(S.email)}</span><span>📞 ${esc(S.phone)}</span></div>
  <a href="cv.pdf" target="_blank" class="btn" style="margin-top:25px;display:inline-block;text-decoration:none;background:#1e293b;color:#38bdf8;border:2px solid #38bdf8;box-shadow:0 0 20px rgba(56,189,248,0.4)">📄 Télécharger CV</a>
</div></section>
<h2>À propos de moi</h2><p style="white-space:pre-line">${esc(S.about)}</p>
<div class="srch">${esc(S.search)}</div><h2>Mes motivations</h2><ul>${(S.motiv||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
<h2>Mes projets</h2><div class="cards">${Object.keys(CATS).map(c=>`<button class="card" data-go="${c}"><b>${CATS[c]}</b><span>${S.projects.filter(p=>p.cat===c).length} projet(s)</span></button>`).join('')}</div>`}
else if(CATS[v]){const L=S.projects.filter(p=>p.cat===v).slice().reverse();h=`<button class="btn g" data-go="home">← Accueil</button><h2>${CATS[v]}</h2>${L.length?L.map(pj).join(''):'<p style="text-align:center;padding:40px">Aucun projet.</p>'}`}
else if(v==='login'){h='<button class="btn g" data-go="home">← Accueil</button><h2>Admin</h2><label>Email</label><input id="l-mail" type="email"><label>Mot de passe</label><input id="l-pw" type="password"><button class="btn" data-act="login">Se connecter</button><p class="meta" id="msg"></p>'}
else if(v==='admin'&&isOwner){h=admin()}
else h=`<button class="btn g" data-go="home">← Accueil</button>`;
if(isOwner&&v!=='admin')h+=`<button class="btn fab" data-go="admin">⚙️ Dashboard</button>`;
R.innerHTML=h;window.scrollTo(0,0)}

function admin(){const p=editing!=null?S.projects.find(x=>x.id===editing):null;
return `
<button class="btn g" data-go="home">← Voir le site</button><h2>Dashboard</h2><button class="btn g" data-act="logout">Se déconnecter</button>
<h3>Profil & Hero</h3>
<label>Nom complet</label><input id="f-name" value="${esc(S.name)}">
<label>Titre</label><input id="f-title" value="${esc(S.title)}">
<label>Ville</label><input id="f-city" value="${esc(S.city)}">
<label>Email</label><input id="f-email" value="${esc(S.email)}">
<label>Phone</label><input id="f-phone" value="${esc(S.phone)}">
<label>Photo (URL)</label><div class="row"><input id="f-photo" value="${esc(S.photo)}" style="flex:1"><input type="file" id="f-photo-file" accept="image/*"></div>
<label>Banner (URL)</label><div class="row"><input id="f-banner" value="${esc(S.banner)}" style="flex:1"><input type="file" id="f-banner-file" accept="image/*"></div>
<label>À propos</label><textarea id="f-about">${esc(S.about)}</textarea>
<label>Recherche</label><input id="f-search" value="${esc(S.search)}">
<label>Motivations</label><textarea id="f-motiv">${(S.motiv||[]).join('\n')}</textarea>
<button class="btn" data-act="profile">Enregistrer le profil</button>
<hr style="margin:40px 0; border:0; border-top:1px solid var(--bd)">
<h3>${p?'Modifier':'Ajouter'} un Projet</h3>
<label>Catégorie</label><select id="p-cat"><option value="ac">Académique</option><option value="pro">Professionnel</option></select>
<label>Titre</label><input id="p-title" value="${p?esc(p.title):''}">
<label>Année</label><input id="p-year" value="${p?esc(p.year):''}">
<label>Outils (séparés par des virgules)</label><input id="p-tools" value="${p?esc(p.tools):''}">
<label>Description</label><textarea id="p-desc">${p?esc(p.desc):''}</textarea>
<label>Images</label><input type="file" id="p-files" multiple>
<div class="row" id="p-th">${imgs.map((u,i)=>`<div class="th"><img src="${u}"><button data-rm="${i}">×</button></div>`).join('')}</div>
<button class="btn" data-act="saveproj">${p?'Mettre à jour':'Ajouter'}</button>
${p?'<button class="btn g" data-act="cancel">Annuler</button>':''}
<h3 style="margin-top:40px">Projets (${S.projects.length})</h3>
${S.projects.slice().reverse().map(x=>`<div class="pj row" style="justify-content:space-between; padding:15px"><div><b>${esc(x.title)}</b></div><div><button class="btn g" data-edit="${x.id}">Modifier</button> <button class="btn d" data-del="${x.id}">Supprimer</button></div></div>`).join('')}
<p id="msg" style="position:fixed; bottom:20px; left:20px; background:#000; color:#fff; padding:10px 20px; border-radius:10px; display:none"></p>`}

async function save(){const m=document.getElementById('msg');try{if(!sb)return; m.style.display='block'; m.textContent='Enregistrement…';
const {error}=await sb.from('site').upsert({id:1,data:S});if(error)throw error;
editing=null;imgs=[];render();m.textContent='Enregistré ✓'; setTimeout(()=>m.style.display='none',2000)}catch(e){alert(e.message)}}

R.addEventListener('click',async e=>{const t=e.target.closest('[data-go],[data-act],[data-edit],[data-del],[data-rm]');if(!t)return;const d=t.dataset;
if(d.go){location.hash=d.go==='home'?'':d.go;render()}
else if(d.rm){imgs.splice(d.rm,1);render()}
else if(d.edit){editing=d.edit;imgs=[...(S.projects.find(x=>x.id===editing).imgs||[])];render()}
else if(d.del&&confirm('Supprimer ce projet ?')){S.projects=S.projects.filter(x=>x.id!==d.del);save()}
else if(d.act==='cancel'){editing=null;imgs=[];render()}
else if(d.act==='profile'){
  S.name=document.getElementById('f-name').value; S.title=document.getElementById('f-title').value; S.city=document.getElementById('f-city').value;
  S.email=document.getElementById('f-email').value; S.phone=document.getElementById('f-phone').value;
  S.photo=document.getElementById('f-photo').value; S.banner=document.getElementById('f-banner').value;
  S.about=document.getElementById('f-about').value; S.search=document.getElementById('f-search').value;
  S.motiv=document.getElementById('f-motiv').value.split('\n').filter(Boolean); save()
}
else if(d.act==='saveproj'){const o={id:editing||'p'+Date.now(),cat:document.getElementById('p-cat').value,title:document.getElementById('p-title').value,year:document.getElementById('p-year').value,tools:document.getElementById('p-tools').value,desc:document.getElementById('p-desc').value,imgs:imgs};
if(editing)S.projects=S.projects.map(x=>x.id===editing?o:x);else S.projects.push(o);save()}});

R.addEventListener('change',async e=>{
  if(!sb)return; const up=async(f,prefix)=>{const path=prefix+Date.now()+'_'+f.name.replace(/[^\w.-]/g,'_');await sb.storage.from('images').upload(path,f);return sb.storage.from('images').getPublicUrl(path).data.publicUrl};
  if(e.target.id==='f-photo-file'){S.photo=await up(e.target.files[0],'avatar_');render()}
  if(e.target.id==='f-banner-file'){S.banner=await up(e.target.files[0],'banner_');render()}
  if(e.target.id==='p-files'){for(const f of e.target.files){imgs.push(await up(f,'pj_'))}render()}
});

R.addEventListener('click',async e=>{const t=e.target.closest('[data-act=login],[data-act=logout]');if(!t)return;
if(t.dataset.act==='logout'){await sb.auth.signOut();location.hash='';return}
const r=await sb.auth.signInWithPassword({email:document.getElementById('l-mail').value,password:document.getElementById('l-pw').value});
if(r.error)alert(r.error.message);else location.hash='admin'});

(function(){const r=document.documentElement,b=document.createElement('button');b.className='tg';b.innerHTML='🌓';
b.onclick=()=>{const n=r.dataset.theme==='dark'?'light':'dark';r.dataset.theme=n;localStorage.setItem('th',n)};
const s=localStorage.getItem('th');if(s)r.dataset.theme=s;document.body.appendChild(b)})();

window.addEventListener('hashchange',render);
// --- مـهـم: عـوض هـاد الـقـيـم بـديـالـك فـ VS CODE ---
const SUPA_URL='https://qapztzivptbwwmtliadz.supabase.co',SUPA_KEY='sb_publishable_7LhriR1LyM6KjG6BOseLqg_O7uHb57Z';let sb=null;
async function init(){if(SUPA_URL.includes('URL_DYALEK'))return render();sb=supabase.createClient(SUPA_URL,SUPA_KEY);
const {data}=await sb.from('site').select('data').eq('id',1).maybeSingle();if(data)Object.assign(S,data.data);
const sess=await sb.auth.getSession();isOwner=!!sess.data.session;
sb.auth.onAuthStateChange((_,s)=>{isOwner=!!s;render()});render()}
init();
</script></body></html>
